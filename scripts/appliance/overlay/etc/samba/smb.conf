# Schnapp appliance — guest-readable share of tray client install kits.
# Path: /srv/schnapp-clients  (populated at image build time)
# UNC:  \\<vm-ip>\clients     or  smb://<vm-ip>/clients

[global]
	workgroup = WORKGROUP
	server string = Schnapp appliance clients
	security = user
	map to guest = Bad User
	guest account = nobody
	smb ports = 445
	disable netbios = yes
	server services = -nbt
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes
	server min protocol = SMB2
	log file = /var/log/samba/log.%m
	max log size = 50

[clients]
	comment = Schnapp tray clients (Linux / Windows install kits)
	path = /srv/schnapp-clients
	browseable = yes
	read only = yes
	guest ok = yes
	force user = nobody
	force group = nogroup
	create mask = 0644
	directory mask = 0755
